<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>山の配送v1.8</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #f0f4f0; color: #333; }
        h1 { color: #2e7d32; font-size: 1.5rem; border-bottom: 2px solid #2e7d32; padding-bottom: 5px; }
        
        .input-group { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        label { display: block; margin-top: 10px; font-weight: bold; font-size: 0.9rem; }
        input, textarea { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
        
        /* ドロップエリア */
        #drop-zone {
            border: 3px dashed #ccc;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            color: #888;
            background-color: #fafafa;
            margin-bottom: 20px;
            transition: background-color 0.3s, border-color 0.3s;
        }
        #drop-zone.dragover {
            background-color: #e8f5e9;
            border-color: #2e7d32;
            color: #2e7d32;
        }
        #drop-zone p { margin: 0; font-weight: bold; }
        #drop-zone small { font-size: 0.8rem; }

        /* 座標用 */
        .coord-row { display: flex; gap: 10px; }
        .coord-row input { width: 50%; }

        button { margin-top: 10px; padding: 12px; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; color: white; transition: opacity 0.2s; }
        button:active { opacity: 0.7; }
        .btn-gps { background-color: #0288d1; width: 100%; }
        .btn-save { background-color: #2e7d32; width: 100%; margin-top: 20px; }
        
        .admin-controls { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
        .btn-csv { background-color: #546e7a; flex: 1; font-size: 0.9rem; min-width: 80px; }
        .btn-clear { background-color: #8d6e63; flex: 1; font-size: 0.9rem; min-width: 80px; }
        .btn-map { background-color: #00897b; flex: 1; font-size: 0.9rem; min-width: 80px; }

        /* ボタン配色 */
        .action-buttons { display: flex; flex-direction: column; gap: 5px; }
        .btn-request { background-color: #d32f2f; color: white; font-size: 0.75rem; padding: 5px 10px; }
        .btn-status { background-color: #fbc02d; color: #333; font-size: 0.75rem; padding: 5px 10px; font-weight: bold; }
        .btn-finish { background-color: #455a64; color: white; font-size: 0.75rem; padding: 5px 10px; }
        .btn-delete { background-color: #7b1fa2; color: white; font-size: 0.75rem; padding: 5px 10px; } 
        
        .instructions { background: #e3f2fd; padding: 10px; border-radius: 5px; font-size: 0.85rem; margin-bottom: 15px; border-left: 5px solid #2196f3; }
        .instructions p { margin: 5px 0; line-height: 1.4; }

        #map-container { display: none; margin-bottom: 20px; border: 2px solid #2e7d32; border-radius: 8px; overflow: hidden; }
        #map { height: 400px; width: 100%; }
        .close-map { background: #ccc; color: #333; text-align: center; padding: 5px; cursor: pointer; font-size: 0.9rem; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; font-size: 0.8rem; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; vertical-align: top; }
        th { background-color: #e8f5e9; position: sticky; top: 0; }
        
        tr:hover { background-color: #f1f8e9; cursor: pointer; }

        .status-default { background-color: #fff; }
        .status-scheduled { background-color: #fff9c4; } 
        .status-completed { background-color: #cfd8dc; color: #78909c; text-decoration: line-through; } 

        .scroll-container { overflow-x: auto; max-height: 500px; border: 1px solid #ccc; }
    </style>
</head>
<body>

    <h1>山の配送v1.8</h1>

    <div id="drop-zone">
        <p>📂 PCの場合はCSVファイルをここにドラッグ＆ドロップ</p>
        <small>現場から届いたCSVをデータ一覧へ読み込みます</small>
    </div>
    <div class="input-group">
        <button class="btn-gps" onclick="getLocation()">（1）現在地を取得</button>
        <p id="status-info" style="font-size: 0.8rem; color: #666; margin: 5px 0;">座標: 未取得（ボタンまたは手入力）</p>
        
        <label>（2）座標入力（度単位・小数第6位まで）</label>
        <div class="coord-row">
            <input type="number" id="lat" step="0.000001" placeholder="緯度 (例:35.123456)">
            <input type="number" id="lng" step="0.000001" placeholder="経度 (例:139.654321)">
        </div>

        <label>（3）丸太情報入力</label>
        <input type="number" id="count" placeholder="本数">
        <input type="number" id="volume" step="0.001" placeholder="材積（m3）">
        <textarea id="memo" rows="2" placeholder="備考欄（現場状況など）"></textarea>

        <button class="btn-save" onclick="saveData()">（4）データを保存</button>
    </div>

    <div class="instructions">
        <p>（5）データ一覧で進捗管理</p>
        <p>　・[依頼] 赤：メール起動（地図リンク自動記入）</p>
        <p>　・[予定] 黄：荷受連絡あり（一覧が黄色になる）</p>
        <p>　・[終了] 灰：荷受完了（一覧が見え消しになる）</p>
        <p>　・[削除] 紫：行データを削除</p>
        <p>　・[位置を確認] 状況可視化。<b>地図表示中に行タップでズームします。</b></p>
    </div>

    <div id="map-container">
        <div id="map"></div>
        <div class="close-map" onclick="document.getElementById('map-container').style.display='none'">▲ 地図を閉じる</div>
    </div>

    <div class="admin-controls">
        <button class="btn-csv" onclick="exportCSV()">CSV出力</button>
        <button class="btn-clear" onclick="clearAllData()">全データ一括削除</button>
        <button class="btn-map" onclick="showAllMap()">位置を確認</button>
    </div>

    <div class="scroll-container">
        <table id="dataTable">
            <thead>
                <tr>
                    <th>保存日時</th>
                    <th>座標</th>
                    <th>本数</th>
                    <th>材積</th>
                    <th>備考</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                </tbody>
        </table>
    </div>

    <script>
        // --- GPS取得 ---
        function getLocation() {
            const info = document.getElementById('status-info');
            if (!navigator.geolocation) {
                info.textContent = "GPS未対応です";
                return;
            }
            info.textContent = "取得中...";
            navigator.geolocation.getCurrentPosition((position) => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                document.getElementById('lat').value = lat;
                document.getElementById('lng').value = lng;
                info.textContent = `取得完了: ${lat.toFixed(6)}, ${lng.toFixed(6)}`;
            }, () => {
                info.textContent = "座標取得エラー";
            });
        }

        // --- データ保存 ---
        function saveData() {
            const lat = document.getElementById('lat').value;
            const lng = document.getElementById('lng').value;
            const count = document.getElementById('count').value;
            const volume = document.getElementById('volume').value;
            const memo = document.getElementById('memo').value;

            if (!lat || !lng || !count || !volume) {
                alert("位置（緯度・経度）、本数、材積は必須です");
                return;
            }

            const now = new Date();
            const year = now.getFullYear();
            const month = (now.getMonth() + 1).toString().padStart(2, '0');
            const date = now.getDate().toString().padStart(2, '0');
            const hour = now.getHours().toString().padStart(2, '0');
            const min = now.getMinutes().toString().padStart(2, '0');
            
            const timestamp = `${year}/${month}/${date} ${hour}:${min}`;

            const newData = {
                id: Date.now(),
                timestamp,
                lat, lng, count, volume, memo,
                status: 'default' 
            };

            const dataList = JSON.parse(localStorage.getItem('yamaDeliveryData') || '[]');
            dataList.push(newData);
            localStorage.setItem('yamaDeliveryData', JSON.stringify(dataList));

            alert("保存しました");
            clearForm();
            renderTable();
        }

        function clearForm() {
            document.getElementById('count').value = "";
            document.getElementById('volume').value = "";
            document.getElementById('memo').value = "";
        }

        // --- テーブル表示 ---
        function renderTable() {
            const dataList = JSON.parse(localStorage.getItem('yamaDeliveryData') || '[]');
            dataList.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

            const tbody = document.querySelector('#dataTable tbody');
            tbody.innerHTML = "";

            dataList.forEach(item => {
                const row = document.createElement('tr');
                row.className = `status-${item.status}`;
                
                row.onclick = (e) => {
                    if (e.target.tagName === 'BUTTON') return;
                    focusOnPin(item.lat, item.lng);
                };

                const latDisplay = parseFloat(item.lat).toFixed(6);
                const lngDisplay = parseFloat(item.lng).toFixed(6);
                
                row.innerHTML = `
                    <td>${item.timestamp}</td>
                    <td>${latDisplay}<br>${lngDisplay}</td>
                    <td>${item.count}</td>
                    <td>${item.volume}</td>
                    <td>${item.memo}</td>
                    <td>
                        <div class="action-buttons">
                            <button class="btn-request" onclick="sendEmail(${item.id})">依頼</button>
                            <button class="btn-status" onclick="updateStatus(${item.id}, 'scheduled')">予定</button>
                            <button class="btn-finish" onclick="updateStatus(${item.id}, 'completed')">終了</button>
                            <button class="btn-delete" onclick="deleteData(${item.id})">削除</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function focusOnPin(lat, lng) {
            const mapContainer = document.getElementById('map-container');
            if (mapContainer.style.display === 'block' && map) {
                map.setView([lat, lng], 18);
            }
        }

        function updateStatus(id, newStatus) {
            let dataList = JSON.parse(localStorage.getItem('yamaDeliveryData') || '[]');
            const index = dataList.findIndex(d => d.id === id);
            if (index !== -1) {
                dataList[index].status = newStatus;
                localStorage.setItem('yamaDeliveryData', JSON.stringify(dataList));
                renderTable();
                if(document.getElementById('map-container').style.display === 'block'){
                    showAllMap();
                }
            }
        }
        
        function deleteData(id) {
            if(!confirm("このデータを削除してもよろしいですか？（復元できません）")) return;
            
            let dataList = JSON.parse(localStorage.getItem('yamaDeliveryData') || '[]');
            dataList = dataList.filter(d => d.id !== id);
            
            localStorage.setItem('yamaDeliveryData', JSON.stringify(dataList));
            renderTable();
            if(document.getElementById('map-container').style.display === 'block'){
                showAllMap();
            }
        }

        // --- メール送信（修正版） ---
        function sendEmail(id) {
            const dataList = JSON.parse(localStorage.getItem('yamaDeliveryData') || '[]');
            const item = dataList.find(d => d.id === id);
            if (!item) return;

            // ▼▼▼ 修正: URLを < > で囲み、メールソフトでのリンク認識率を上げる ▼▼▼
            const mapUrl = `https://maps.google.com/?q=${item.lat},${item.lng}`;
            const bodyText = `【配送依頼】\n日時: ${item.timestamp}\n本数: ${item.count}本\n材積: ${item.volume}m3\n備考: ${item.memo}\n\n場所(GoogleMap):\n<${mapUrl}>`;

            window.location.href = `mailto:?subject=配送依頼_${item.timestamp}&body=${encodeURIComponent(bodyText)}`;
        }

        // --- 地図表示 ---
        let map = null;
        function showAllMap() {
            const dataList = JSON.parse(localStorage.getItem('yamaDeliveryData') || '[]');
            if (dataList.length === 0) {
                alert("表示するデータがありません");
                return;
            }

            document.getElementById('map-container').style.display = 'block';

            if (!map) {
                map = L.map('map');
                L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
                    attribution: '© <a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">国土地理院</a>'
                }).addTo(map);
            }

            map.eachLayer((layer) => {
                if (layer instanceof L.CircleMarker) {
                    map.removeLayer(layer);
                }
            });

            const bounds = [];
            dataList.forEach(item => {
                let color = 'red'; 
                let statusText = '未定';
                if (item.status === 'scheduled') { color = '#fbc02d'; statusText = '予定'; } 
                if (item.status === 'completed') { color = 'gray'; statusText = '終了'; }   

                const marker = L.circleMarker([item.lat, item.lng], {
                    color: color,
                    fillColor: color,
                    fillOpacity: 0.7,
                    radius: 10
                }).addTo(map);

                marker.bindPopup(`
                    <b>状況: ${statusText}</b><br>
                    日時: ${item.timestamp}<br>
                    材積: ${item.volume}m3 (${item.count}本)<br>
                    ${item.memo}
                `);
                
                bounds.push([item.lat, item.lng]);
            });

            if (bounds.length > 0) {
                map.fitBounds(bounds);
            }
        }

        // --- CSV出力 ---
        function exportCSV() {
            const dataList = JSON.parse(localStorage.getItem('yamaDeliveryData') || '[]');
            if (dataList.length === 0) {
                alert("データがありません");
                return;
            }

            let csvContent = "\uFEFF日時,緯度,経度,本数,材積,備考,現在の状況\n";
            dataList.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
            
            dataList.forEach(d => {
                let statusJp = "未定";
                if (d.status === 'scheduled') statusJp = "予定";
                if (d.status === 'completed') statusJp = "終了";

                csvContent += `${d.timestamp},${d.lat},${d.lng},${d.count},${d.volume},"${d.memo.replace(/"/g, '""')}",${statusJp}\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            
            // ▼▼▼ ファイル名生成ロジック変更 ▼▼▼
            const now = new Date();
            const yyyy = now.getFullYear();
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const hh = String(now.getHours()).padStart(2, '0');
            const min = String(now.getMinutes()).padStart(2, '0');
            
            link.download = `山の配送-${yyyy}${mm}${dd}-${hh}${min}.csv`;
            // ▲▲▲ 変更ここまで ▲▲▲

            link.click();
        }

        // --- 一括削除 ---
        function clearAllData() {
            if (confirm("全てのデータを削除します。CSV出力は済みましたか？")) {
                localStorage.removeItem('yamaDeliveryData');
                renderTable();
                if(map) { 
                    map.eachLayer((layer) => { if (layer instanceof L.CircleMarker) map.removeLayer(layer); }); 
                }
            }
        }

        // --- ドラッグ＆ドロップ ---
        const dropZone = document.getElementById('drop-zone');

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');

            const file = e.dataTransfer.files[0];
            if (!file || !file.name.endsWith('.csv')) {
                alert("CSVファイルをドロップしてください");
                return;
            }

            const reader = new FileReader();
            reader.onload = (event) => {
                const text = event.target.result;
                importCSV(text);
            };
            reader.readAsText(file);
        });

        function importCSV(csvText) {
            const lines = csvText.split('\n');
            let importedCount = 0;
            const dataList = JSON.parse(localStorage.getItem('yamaDeliveryData') || '[]');

            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                const match = line.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g);
                if (!match || match.length < 7) continue;

                const values = match.map(v => v.replace(/^"|"$/g, '').replace(/""/g, '"'));

                let statusCode = 'default';
                if (values[6] === '予定') statusCode = 'scheduled';
                if (values[6] === '終了') statusCode = 'completed';

                const isDuplicate = dataList.some(d => 
                    d.timestamp === values[0] && 
                    d.lat == values[1] && 
                    d.lng == values[2]
                );

                if (!isDuplicate) {
                    const newData = {
                        id: Date.now() + i, 
                        timestamp: values[0],
                        lat: values[1],
                        lng: values[2],
                        count: values[3],
                        volume: values[4],
                        memo: values[5],
                        status: statusCode
                    };
                    dataList.push(newData);
                    importedCount++;
                }
            }

            localStorage.setItem('yamaDeliveryData', JSON.stringify(dataList));
            alert(`${importedCount}件のデータを読み込みました`);
            renderTable();
        }

        renderTable();

    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js');
            });
        }
    </script>
</body>
</html>
