<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>山の配送アプリ</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background-color: #f0f4f0; }
        h1 { color: #2e7d32; font-size: 1.5rem; }
        .input-group { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input, textarea { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
        button { margin-top: 15px; padding: 12px; width: 100%; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; color: white; }
        .btn-gps { background-color: #0288d1; }
        .btn-save { background-color: #2e7d32; }
        .btn-request { background-color: #f57c00; width: auto; padding: 5px 10px; font-size: 0.8rem; }
        .btn-delete { background-color: #d32f2f; width: auto; padding: 5px 10px; font-size: 0.8rem; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; font-size: 0.85rem; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #e8f5e9; }
        .scroll-container { overflow-x: auto; }
    </style>
</head>
<body>

    <h1>🌲 山の配送依頼</h1>

    <div class="input-group">
        <button class="btn-gps" onclick="getLocation()">（1）現在地を取得</button>
        <p id="status" style="font-size: 0.8rem; color: #666;">座標: 未取得</p>
        
        <input type="hidden" id="lat">
        <input type="hidden" id="lng">

        <label>（2）丸太情報入力</label>
        <input type="number" id="count" placeholder="本数（整数）">
        <input type="number" id="volume" step="0.001" placeholder="材積（m3）">
        <textarea id="memo" rows="3" placeholder="備考欄（現場状況など）"></textarea>

        <button class="btn-save" onclick="saveData()">（3）データを保存</button>
    </div>

    <h2>データ一覧</h2>
    <div class="scroll-container">
        <table id="dataTable">
            <thead>
                <tr>
                    <th>保存日時</th>
                    <th>座標</th>
                    <th>本数</th>
                    <th>材積</th>
                    <th>備考</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                </tbody>
        </table>
    </div>

    <script>
        // GPS取得
        function getLocation() {
            const status = document.getElementById('status');
            if (!navigator.geolocation) {
                status.textContent = "お使いのブラウザはGPS未対応です";
                return;
            }
            status.textContent = "取得中...";
            navigator.geolocation.getCurrentPosition((position) => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                document.getElementById('lat').value = lat;
                document.getElementById('lng').value = lng;
                status.textContent = `取得完了: ${lat.toFixed(6)}, ${lng.toFixed(6)}`;
            }, () => {
                status.textContent = "座標が取得できませんでした";
            });
        }

        // データの保存
        function saveData() {
            const lat = document.getElementById('lat').value;
            const lng = document.getElementById('lng').value;
            const count = document.getElementById('count').value;
            const volume = document.getElementById('volume').value;
            const memo = document.getElementById('memo').value;

            if (!lat || !count || !volume) {
                alert("位置情報、本数、材積は必須です");
                return;
            }

            const now = new Date();
            const timestamp = `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`;

            const newData = {
                id: Date.now(),
                timestamp,
                lat, lng, count, volume, memo
            };

            // LocalStorageから取得して追加
            const dataList = JSON.parse(localStorage.getItem('deliveryData') || '[]');
            dataList.push(newData);
            localStorage.setItem('deliveryData', JSON.stringify(dataList));

            alert("データを保存しました");
            clearForm();
            renderTable();
        }

        function clearForm() {
            document.getElementById('count').value = "";
            document.getElementById('volume').value = "";
            document.getElementById('memo').value = "";
        }

        // テーブルの描画
        function renderTable() {
            const dataList = JSON.parse(localStorage.getItem('deliveryData') || '[]');
            const tbody = document.querySelector('#dataTable tbody');
            tbody.innerHTML = "";

            dataList.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${item.timestamp}</td>
                    <td>${parseFloat(item.lat).toFixed(4)}, ${parseFloat(item.lng).toFixed(4)}</td>
                    <td>${item.count}</td>
                    <td>${item.volume}</td>
                    <td>${item.memo}</td>
                    <td>
                        <button class="btn-request" onclick="sendEmail(${item.id})">配送依頼</button>
                        <button class="btn-delete" onclick="deleteData(${item.id})">削除</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        // メール送信（配送依頼）
        function sendEmail(id) {
            const dataList = JSON.parse(localStorage.getItem('deliveryData') || '[]');
            const item = dataList.find(d => d.id === id);
            if (!item) return;

            const subject = encodeURIComponent(`【配送依頼】丸太輸送のお願い (${item.timestamp})`);
            
            // Googleマップのリンク作成 (ピンに情報を表示させるためのフォーマット)
            // q=緯度,経度(ラベル名) という形式
            const mapUrl = `https://maps.google.com/maps?q=${item.lat},${item.lng}(材積:${item.volume}m3/${item.count}本)`;

            const bodyText = `配送依頼の詳細をお送りします。\n\n` +
                             `■依頼日時: ${item.timestamp}\n` +
                             `■丸太本数: ${item.count} 本\n` +
                             `■合計材積: ${item.volume} m3\n` +
                             `■備考: ${item.memo}\n\n` +
                             `■場所（Googleマップ）:\n${mapUrl}\n\n` +
                             `ご確認のほど、よろしくお願いいたします。`;

            const mailtoUrl = `mailto:?subject=${subject}&body=${encodeURIComponent(bodyText)}`;
            
            window.location.href = mailtoUrl;
        }

        // データ削除
        function deleteData(id) {
            if (!confirm("このデータを削除してもよろしいですか？")) return;
            let dataList = JSON.parse(localStorage.getItem('deliveryData') || '[]');
            dataList = dataList.filter(d => d.id !== id);
            localStorage.setItem('deliveryData', JSON.stringify(dataList));
            renderTable();
        }

        // 起動時にテーブルを表示
        renderTable();
    </script>
</body>
</html>
